<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <!-- One arrow pointing right, drawn flat on the ground (the game lays four of them round a spot and squashes them to the 2:1 view). -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ff8a"/>
      <stop offset="0.5" stop-color="#4fe03a"/>
      <stop offset="1" stop-color="#1f9a22"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <path d="M6 28 H70 V9 L122 38 L70 67 V48 H6 Z" fill="#000" fill-opacity="0.38" transform="translate(0 -3)"/>
  <!-- body -->
  <path d="M4 24 H68 V5 L122 32 L68 59 V40 H4 Z" fill="url(#top)" stroke="#0b3a10" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- highlight along the top edge -->
  <path d="M10 27.5 H72 V15 L103 30" fill="none" stroke="#e8ffd0" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
