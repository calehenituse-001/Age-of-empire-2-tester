<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="-160 -80 320 160">
  <rect x="-160" y="-80" width="320" height="160" fill="#5c8a3c"/>
  <!-- four arrows round a spot on the ground, then the 2:1 projection (rotate 45 degrees, squash height) -->
  <g transform="matrix(0.7071 0.35355 -0.7071 0.35355 0 0) scale(1.1)">
    <g id="a"><use href="#arrow" transform="translate(-85 -32)"/></g>
    <g transform="rotate(90)"><use href="#arrow" transform="translate(-85 -32)"/></g>
    <g transform="rotate(180)"><use href="#arrow" transform="translate(-85 -32)"/></g>
    <g transform="rotate(270)"><use href="#arrow" transform="translate(-85 -32)"/></g>
  </g>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ff8a"/><stop offset="0.5" stop-color="#4fe03a"/><stop offset="1" stop-color="#1f9a22"/>
    </linearGradient>
    <g id="arrow">
      <path d="M6 28 H70 V9 L122 38 L70 67 V48 H6 Z" fill="#000" fill-opacity="0.38" transform="translate(0 -3)"/>
      <path d="M4 24 H68 V5 L122 32 L68 59 V40 H4 Z" fill="url(#top)" stroke="#0b3a10" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M10 27.5 H72 V15 L103 30" fill="none" stroke="#e8ffd0" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
</svg>
