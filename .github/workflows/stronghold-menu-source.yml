name: Stronghold menu source check (no APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stronghold/**'
      - '.github/workflows/stronghold-menu-source.yml'
  pull_request:
    paths:
      - 'stronghold/**'
      - '.github/workflows/stronghold-menu-source.yml'

permissions:
  contents: read

jobs:
  java-and-python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
      - name: Install Android SDK for Java and DEX
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check Stronghold UI source and JVM settings
        shell: bash
        run: |
          set -euo pipefail
          cd stronghold
          mkdir -p build/source-check
          find android asfatre_v13 -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/source-check
          javac -cp "build/source-check:$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/source-check tests/SettingsTest.java
          java -cp "build/source-check:$ANDROID_HOME/platforms/android-35/android.jar" SettingsTest
          python3 -m py_compile tools/*.py tests/*.py
          find build/source-check/org -name '*.class' > build/classes-to-dex.txt
          mkdir -p build/menu-dex
          mapfile -t classes < build/classes-to-dex.txt
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output build/menu-dex "${classes[@]}"
          test -s build/menu-dex/classes.dex
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/menu-dex/apksigner.jar
          test -s build/menu-dex/apksigner.jar
          echo 'Source and DEX check passed. No copyrighted APK was built or uploaded.'
      - name: Upload menu DEX (source-only, no game assets)
        uses: actions/upload-artifact@v4
        with:
          name: Stronghold-Menu-Dex
          path: |
            stronghold/build/menu-dex/classes.dex
            stronghold/build/menu-dex/apksigner.jar
          if-no-files-found: error

# Runs only for Stronghold-related pull requests or on manual dispatch. The original proprietary APK is NOT in this repo.
# To package a signed Stronghold APK, follow stronghold/docs/BUILD.md with
# the exact user-provided original launcher, outside this public CI workflow.
