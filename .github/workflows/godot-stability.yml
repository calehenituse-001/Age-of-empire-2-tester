name: Godot stability tests (no APK)
on:
  push:
    branches: ['stability/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64' >> "$GITHUB_ENV"
      - name: Run parser, gameplay and import-transaction tests
        run: |
          python3 tools/validate_godot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-stability-test-logs
          path: artifacts/godot-validation.log
          if-no-files-found: warn
